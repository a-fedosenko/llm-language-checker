[project]
name = "llm-language-checker"
version = "0.1.0"
description = "Empirical, heuristic checks of which languages an LLM can actually produce"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
]

[project.scripts]
llmlc = "llmlc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]
lid = ["fasttext-wheel>=0.9.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
