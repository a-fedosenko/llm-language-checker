# Single container. Results go to a SQLite file under ./data, so there is no
# database service to run -- this is a single-tenant local tool.
#
# There is no `gpu` profile and no `bt` service. Back-translation is remote, by a
# panel qualified per language (see bt/qualify.py); the local MADLAD/NLLB service
# planned for S3 and then S6 was never built, and docs/03 records why it was left
# out rather than pretending it exists. `data/models/` is still mounted because
# GlotLID lives there, and GlotLID is CPU-only.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      SCHEME: ${SCHEME:-default}
      HARDWARE_PROFILE: ${HARDWARE_PROFILE:-auto}
      # Starting a scan from the browser spends your API budget. Inside a
      # container the caller's address is the bridge gateway and never loopback,
      # so the port binding below is what limits who can reach it -- which is why
      # opening the trigger here is a deliberate, separate act.
      # `any`, not `loopback`, and this is the one place the difference is not a
      # loosening. Inside a container the caller's address is always the bridge
      # gateway, so `loopback` can never match and the UI's scan button returns
      # 403 for everyone -- which is what a fresh clone used to hit. The control
      # here is the port binding below, published on 127.0.0.1 by default.
      SCAN_TRIGGER: ${SCAN_TRIGGER:-any}
      # Set to 1 to fetch GlotLID (~1.6 GB) and build the FLORES controls at
      # startup instead of pressing the button in the UI. Off by default: 1.6 GB
      # arriving unannounced on `compose up` would be a rude surprise.
      AUTO_BOOTSTRAP: ${AUTO_BOOTSTRAP:-0}
    env_file:
      - path: .env
        required: false
    volumes:
      # Schemes and results are data, not code: bring your own locale list and
      # keep your results, without rebuilding the image.
      - ./schemes:/app/schemes:ro
      - ./data:/app/data
    ports:
      # Bound to the loopback interface, not 0.0.0.0: this is a local tool with
      # no authentication, and the default should not put it on the network.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
