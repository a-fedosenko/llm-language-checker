# Single container. Results go to a SQLite file under ./data, so there is no
# database service to run -- this is a single-tenant local tool.
# `docker compose --profile gpu up` will add the GPU back-translator (S6).
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      SCHEME: ${SCHEME:-default}
      HARDWARE_PROFILE: ${HARDWARE_PROFILE:-auto}
    env_file:
      - path: .env
        required: false
    volumes:
      # Schemes and results are data, not code: bring your own locale list and
      # keep your results, without rebuilding the image.
      - ./schemes:/app/schemes:ro
      - ./data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
